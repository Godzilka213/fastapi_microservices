# docker-compose.yml
services:
  rabbitmq:
    image: rabbitmq:4.1.1-management-alpine
    ports:
      - "127.0.0.1:15672:15672" # Порт для веб-интерфейса RabbitMQ Management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck: # Проверка готовности RabbitMQ
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Новый сервис API Gateway
  api_gateway_service:
    build: ./api_gateway_service # Путь к Dockerfile для Gateway
    ports:
      - "127.0.0.1:8000:8000" # Клиент будет обращаться к шлюзу по этому порту
    environment:
      POSTS_SERVICE_URL: http://posts_service:8000 # Внутренний URL Posts Service
      CATEGORIES_SERVICE_URL: http://categories_service:8000 # Внутренний URL Categories Service
    depends_on:
      posts_service:
        condition: service_started # Gateway зависит от Posts Service
      categories_service:
        condition: service_started # Gateway зависит от Categories Service
    restart: on-failure # Перезапускать, если произойдет сбой

  posts_service:
    build: ./posts_service
    # Если нужен прямой доступ для отладки, раскомментируйте:
    # ports:
    #   - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/posts.db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - posts_db_data:/app/data
    depends_on:
      categories_service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  categories_service:
    build: ./categories_service
    # Если нужен прямой доступ для отладки, раскомментируйте:
    # ports:
    #   - "127.0.0.1:8002:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/categories.db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - categories_db_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  posts_db_data:
  categories_db_data: